version: 1
frontend:
    phases:
        preBuild:
            commands:
                - 'cd foodwise-dashboard'
                - 'npm ci'
        build:
            commands:
                - 'npm run build'
    artifacts:
        baseDirectory: foodwise-dashboard/build
        files:
            - '**/*'
    cache:
        paths:
            - 'foodwise-dashboard/node_modules/**/*'