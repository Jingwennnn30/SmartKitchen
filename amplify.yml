version: 1
backend:
    phases:
        build:
            commands:
                - 'echo "Deploying serverless backend functions..."'
                - 'cd lambda-functions && zip -r quicksight-function.zip quicksight_embed_lambda.py'
                - 'aws lambda update-function-code --function-name quicksight-embed --zip-file fileb://quicksight-function.zip'
frontend:
    phases:
        preBuild:
            commands:
                - 'cd foodwise-dashboard'
                - 'npm ci'
        build:
            commands:
                - 'npm run build'
    artifacts:
        baseDirectory: foodwise-dashboard/build
        files:
            - '**/*'
    cache:
        paths:
            - 'foodwise-dashboard/node_modules/**/*'